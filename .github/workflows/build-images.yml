# Reusable workflow: build each image flavor natively per architecture
# (amd64 and arm64 runners, no QEMU), merge the per-arch images into one
# multi-arch candidate manifest, test them on real amd64 AND arm64 runners,
# scan them with Trivy, and only then promote the tested manifests to their
# final tags.
#
# Called by ci.yml (merge to main/master) and release.yml (manual release).
# Promotion uses `docker buildx imagetools create`, so the exact manifests
# that were tested are retagged - nothing is rebuilt after testing.
#
# Note: the mutable `<prefix>-ci` candidate tags are CI-internal. Callers must
# serialize runs (concurrency group) so candidates cannot be overwritten
# between build and promote.
name: Build Images (reusable)

on:
  workflow_call:
    inputs:
      version:
        description: "Full SemVer version (X.Y.Z)"
        required: true
        type: string
      major:
        description: "Major version part"
        required: true
        type: string
      minor:
        description: "Minor version part"
        required: true
        type: string

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ---------------------------------------------------------------------------
  # Build each architecture natively (no QEMU) and push per-arch candidates
  # ---------------------------------------------------------------------------
  build:
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
        image: [alpine, alpine-dev, ubuntu, ubuntu-dev]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push per-arch candidate
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile.${{ matrix.image }}
          platforms: linux/${{ matrix.arch }}
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ matrix.image }}-ci-${{ matrix.arch }}
          labels: |
            org.opencontainers.image.title=spatialite-base-image
            org.opencontainers.image.description=${{ contains(matrix.image, 'dev') && 'Multi-arch SpatiaLite dev image with GDAL, SQLite, SpatiaLite, GEOS, librttopo, Go (headers, gcc, pkg-config)' || 'Multi-arch slim SpatiaLite runtime image (SQLite, SpatiaLite, GEOS, PROJ, librttopo - no GDAL)' }}
            org.opencontainers.image.version=${{ inputs.version }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.licenses=GPL-2.0-or-later
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}-${{ matrix.arch }}
          provenance: false

  # ---------------------------------------------------------------------------
  # Merge the per-arch candidates into one multi-arch candidate manifest
  # ---------------------------------------------------------------------------
  merge:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        image: [alpine, alpine-dev, ubuntu, ubuntu-dev]

    steps:
      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create multi-arch candidate manifest
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          FLAVOR: ${{ matrix.image }}
        run: |
          docker buildx imagetools create \
            -t "${IMAGE}:${FLAVOR}-ci" \
            "${IMAGE}:${FLAVOR}-ci-amd64" \
            "${IMAGE}:${FLAVOR}-ci-arm64"

  # ---------------------------------------------------------------------------
  # Test and scan the candidate on native runners for BOTH architectures
  # ---------------------------------------------------------------------------
  test:
    needs: merge
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
        image: [alpine, alpine-dev, ubuntu, ubuntu-dev]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Test runtime image
        run: |
          docker run --rm \
            -v ${{ github.workspace }}/tests:/tests \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ matrix.image }}-ci \
            /tests/test-image.sh

      - name: Test dev image
        if: contains(matrix.image, 'dev')
        run: |
          docker run --rm \
            -v ${{ github.workspace }}/tests:/tests \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ matrix.image }}-ci \
            /tests/test-dev-image.sh

      - name: Scan candidate for vulnerabilities (fail on fixable HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ matrix.image }}-ci
          format: table
          scanners: vuln
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

  # ---------------------------------------------------------------------------
  # Promote the tested candidate manifests to their final tags (no rebuild)
  # ---------------------------------------------------------------------------
  promote:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - tag_prefix: alpine
            is_default: true
            is_default_dev: false
          - tag_prefix: alpine-dev
            is_default: false
            is_default_dev: true
          - tag_prefix: ubuntu
            is_default: false
            is_default_dev: false
          - tag_prefix: ubuntu-dev
            is_default: false
            is_default_dev: false

    steps:
      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Promote candidate to final tags
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          PREFIX: ${{ matrix.tag_prefix }}
          VERSION: ${{ inputs.version }}
          MAJOR: ${{ inputs.major }}
          MINOR: ${{ inputs.minor }}
          IS_DEFAULT: ${{ matrix.is_default }}
          IS_DEFAULT_DEV: ${{ matrix.is_default_dev }}
        run: |
          set -euo pipefail

          TAGS=""
          add_tags() {
            for t in "$@"; do
              TAGS="$TAGS -t ${IMAGE}:$t"
            done
          }

          add_tags "${PREFIX}-${VERSION}" "${PREFIX}-${MAJOR}.${MINOR}" "${PREFIX}-${MAJOR}" "${PREFIX}-latest"

          if [ "$IS_DEFAULT" = "true" ]; then
            add_tags "${VERSION}" "${MAJOR}.${MINOR}" "${MAJOR}" "latest"
          fi

          if [ "$IS_DEFAULT_DEV" = "true" ]; then
            add_tags "dev-${VERSION}" "dev-${MAJOR}.${MINOR}" "dev-${MAJOR}" "dev"
          fi

          # shellcheck disable=SC2086
          docker buildx imagetools create $TAGS "${IMAGE}:${PREFIX}-ci"

          echo "Promoted ${IMAGE}:${PREFIX}-ci to:${TAGS//-t /}"
