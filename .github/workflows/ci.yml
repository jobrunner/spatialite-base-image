name: CI

on:
  push:
    branches: [main, master]
  # No branch filter: stacked PRs (base = feature branch) are validated too
  pull_request:

# Least privilege by default; jobs that need more declare it themselves.
permissions:
  contents: read

# Serialize runs per ref so merge builds cannot race each other on the
# candidate tags, the final image tags, or the git version tag.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # =============================================================================
  # VALIDATION STAGE - Runs always first
  # =============================================================================
  validate:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      major: ${{ steps.version.outputs.major }}
      minor: ${{ steps.version.outputs.minor }}

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - name: Validate VERSION format (SemVer)
        id: version
        run: |
          VERSION=$(cat VERSION | tr -d '[:space:]')
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

          # Check SemVer format (X.Y.Z)
          if ! echo "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::VERSION '$VERSION' is not valid SemVer format (expected X.Y.Z)"
            exit 1
          fi

          MAJOR=$(echo $VERSION | cut -d. -f1)
          MINOR=$(echo $VERSION | cut -d. -f2)
          echo "major=$MAJOR" >> $GITHUB_OUTPUT
          echo "minor=$MINOR" >> $GITHUB_OUTPUT

          echo "✓ VERSION $VERSION is valid SemVer"

      - name: Validate VERSION does not exist as tag
        run: |
          VERSION=$(cat VERSION | tr -d '[:space:]')
          TAG="v${VERSION}"

          if git ls-remote --tags origin | grep -q "refs/tags/${TAG}$"; then
            echo "::error::Tag $TAG already exists. Please increment VERSION."
            exit 1
          fi

          echo "✓ Tag $TAG does not exist yet"

      - name: Validate CHANGELOG has entry for VERSION
        run: |
          VERSION=$(cat VERSION | tr -d '[:space:]')

          if ! grep -q "^## \[${VERSION}\]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no entry for version $VERSION"
            echo "Expected a line like: ## [$VERSION] - YYYY-MM-DD"
            exit 1
          fi

          echo "✓ CHANGELOG.md has entry for version $VERSION"

  # =============================================================================
  # LINT STAGE - Dockerfile linting and misconfiguration scanning
  # (mirrors the local pre-commit hooks: hadolint + trivy config)
  # =============================================================================
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Hadolint Dockerfile.alpine
        uses: hadolint/hadolint-action@2332a7b74a6de0dda2e2221d575162eba76ba5e5 # v3.3.0
        with:
          dockerfile: Dockerfile.alpine

      - name: Hadolint Dockerfile.alpine-dev
        uses: hadolint/hadolint-action@2332a7b74a6de0dda2e2221d575162eba76ba5e5 # v3.3.0
        with:
          dockerfile: Dockerfile.alpine-dev

      - name: Hadolint Dockerfile.ubuntu
        uses: hadolint/hadolint-action@2332a7b74a6de0dda2e2221d575162eba76ba5e5 # v3.3.0
        with:
          dockerfile: Dockerfile.ubuntu

      - name: Hadolint Dockerfile.ubuntu-dev
        uses: hadolint/hadolint-action@2332a7b74a6de0dda2e2221d575162eba76ba5e5 # v3.3.0
        with:
          dockerfile: Dockerfile.ubuntu-dev

      - name: Trivy misconfiguration scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: "1"

  # =============================================================================
  # PR: BUILD AND TEST (no push, local images only)
  # =============================================================================
  pr-build-and-test:
    needs: [validate, lint]
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - dockerfile: Dockerfile.alpine
            image_name: alpine
            dev: false
          - dockerfile: Dockerfile.alpine-dev
            image_name: alpine-dev
            dev: true
          - dockerfile: Dockerfile.ubuntu
            image_name: ubuntu
            dev: false
          - dockerfile: Dockerfile.ubuntu-dev
            image_name: ubuntu-dev
            dev: true

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build image (no push)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: false
          load: true
          tags: spatialite:${{ matrix.image_name }}
          cache-from: type=gha,scope=${{ matrix.image_name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image_name }}
          provenance: false

      - name: Test runtime image
        run: |
          docker run --rm \
            -v ${{ github.workspace }}/tests:/tests \
            spatialite:${{ matrix.image_name }} \
            /tests/test-image.sh

      - name: Test dev image
        if: matrix.dev
        run: |
          docker run --rm \
            -v ${{ github.workspace }}/tests:/tests \
            spatialite:${{ matrix.image_name }} \
            /tests/test-dev-image.sh

      - name: Scan image for vulnerabilities (fail on fixable HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: spatialite:${{ matrix.image_name }}
          format: table
          scanners: vuln
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

  # =============================================================================
  # MERGE: BUILD -> TEST (amd64 + arm64) -> SCAN -> PROMOTE FINAL TAGS
  # Images are only promoted to their final tags (incl. latest) after all
  # tests and scans have passed. See build-images.yml.
  # =============================================================================
  build-test-promote:
    needs: [validate, lint]
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/build-images.yml
    with:
      version: ${{ needs.validate.outputs.version }}
      major: ${{ needs.validate.outputs.major }}
      minor: ${{ needs.validate.outputs.minor }}

  # =============================================================================
  # MERGE: RELEASE (create git tag and GitHub release)
  # =============================================================================
  release:
    needs: [validate, build-test-promote]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - name: Create git tag
        run: |
          VERSION="${{ needs.validate.outputs.version }}"
          TAG="v${VERSION}"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git tag -a "${TAG}" -m "Release ${VERSION}"
          git push origin "${TAG}"

      - name: Extract release notes from CHANGELOG
        id: changelog
        run: |
          VERSION="${{ needs.validate.outputs.version }}"
          NOTES=$(awk "/^## \\[${VERSION}\\]/{flag=1; next} /^## \\[/{flag=0} flag" CHANGELOG.md)

          {
            echo "notes<<EOF"
            echo "$NOTES"
            echo "EOF"
          } >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          name: v${{ needs.validate.outputs.version }}
          tag_name: v${{ needs.validate.outputs.version }}
          body: |
            ## What's Changed

            ${{ steps.changelog.outputs.notes }}

            ## Docker Images

            ```bash
            # Alpine (default)
            docker pull ghcr.io/${{ github.repository }}:latest
            docker pull ghcr.io/${{ github.repository }}:${{ needs.validate.outputs.version }}

            # Ubuntu
            docker pull ghcr.io/${{ github.repository }}:ubuntu-latest
            docker pull ghcr.io/${{ github.repository }}:ubuntu-${{ needs.validate.outputs.version }}

            # Development images (Alpine)
            docker pull ghcr.io/${{ github.repository }}:dev
            docker pull ghcr.io/${{ github.repository }}:dev-${{ needs.validate.outputs.version }}

            # Development images (Ubuntu)
            docker pull ghcr.io/${{ github.repository }}:ubuntu-dev-latest
            docker pull ghcr.io/${{ github.repository }}:ubuntu-dev-${{ needs.validate.outputs.version }}
            ```

            See [Container Registry](https://github.com/${{ github.repository }}/pkgs/container/spatialite-base-image) for all available tags.
          generate_release_notes: false
