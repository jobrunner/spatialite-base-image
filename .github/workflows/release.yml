name: Manual Release

# This workflow is for manual/emergency releases only.
# Normal releases happen automatically via CI when merging to main.
# It runs the exact same build -> test -> scan -> promote pipeline as CI
# (see build-images.yml) - emergency releases are NOT exempt from testing.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., 1.0.0) - must match VERSION file'
        required: true
        type: string

permissions:
  contents: read

# Same group as ci.yml so a manual release cannot race a merge build
# on the candidate tags or final image tags.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      major: ${{ steps.version.outputs.major }}
      minor: ${{ steps.version.outputs.minor }}
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - name: Validate input matches VERSION file
        id: version
        run: |
          FILE_VERSION=$(cat VERSION | tr -d '[:space:]')
          INPUT_VERSION="${{ inputs.version }}"

          if [ "$FILE_VERSION" != "$INPUT_VERSION" ]; then
            echo "::error::Input version ($INPUT_VERSION) does not match VERSION file ($FILE_VERSION)"
            exit 1
          fi

          MAJOR=$(echo "$FILE_VERSION" | cut -d. -f1)
          MINOR=$(echo "$FILE_VERSION" | cut -d. -f2)
          {
            echo "version=$FILE_VERSION"
            echo "major=$MAJOR"
            echo "minor=$MINOR"
          } >> "$GITHUB_OUTPUT"

          echo "✓ Version $FILE_VERSION matches VERSION file"

  build-test-promote:
    needs: validate
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/build-images.yml
    with:
      version: ${{ needs.validate.outputs.version }}
      major: ${{ needs.validate.outputs.major }}
      minor: ${{ needs.validate.outputs.minor }}

  create-release:
    needs: [validate, build-test-promote]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Extract release notes from CHANGELOG
        id: changelog
        run: |
          VERSION="${{ inputs.version }}"
          NOTES=$(awk "/^## \\[${VERSION}\\]/{flag=1; next} /^## \\[/{flag=0} flag" CHANGELOG.md)

          {
            echo "notes<<EOF"
            echo "$NOTES"
            echo "EOF"
          } >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          name: v${{ inputs.version }}
          tag_name: v${{ inputs.version }}
          body: |
            ## What's Changed

            ${{ steps.changelog.outputs.notes }}

            ## Docker Images

            ```bash
            # Alpine (default)
            docker pull ghcr.io/${{ github.repository }}:latest
            docker pull ghcr.io/${{ github.repository }}:${{ inputs.version }}

            # Ubuntu
            docker pull ghcr.io/${{ github.repository }}:ubuntu-latest
            docker pull ghcr.io/${{ github.repository }}:ubuntu-${{ inputs.version }}

            # Development images (Alpine)
            docker pull ghcr.io/${{ github.repository }}:dev
            docker pull ghcr.io/${{ github.repository }}:dev-${{ inputs.version }}

            # Development images (Ubuntu)
            docker pull ghcr.io/${{ github.repository }}:ubuntu-dev-latest
            docker pull ghcr.io/${{ github.repository }}:ubuntu-dev-${{ inputs.version }}
            ```

            See [Container Registry](https://github.com/${{ github.repository }}/pkgs/container/spatialite-base-image) for all available tags.
          generate_release_notes: false
