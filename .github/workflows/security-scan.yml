name: Security Scan

# Scans the published images every 6 hours (the Trivy vulnerability DB is
# refreshed at the same cadence) and reports all findings to GitHub Code
# Scanning.
#
# Fixable findings of any severity (the same LOW-and-up release gate as
# build-images.yml, for runtime and -dev images) are not just reported: the workflow maintains ONE security release PR (VERSION bump +
# CHANGELOG entry listing the CVEs) as the repository's GitHub App, with
# auto-merge enabled. CI rebuilds the images on that PR - PACKAGE_REFRESH
# makes apk/apt upgrade pull the fixed packages - and the Trivy gate proves
# the fix before the PR merges and the release is published. If the gate
# stays red, the fix is not available by rebuilding (e.g. Go stdlib, which
# needs a Go update) and the PR waits for a human.

on:
  schedule:
    - cron: "41 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-scan
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  PR_BRANCH: security/release
  PR_LABEL: security-release

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        image: [alpine, alpine-dev, ubuntu, ubuntu-dev]

    steps:
      - name: Login to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Trivy scan (SARIF report, all severities)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ matrix.image }}-latest
          format: sarif
          output: trivy-${{ matrix.image }}.sarif
          scanners: vuln
          severity: CRITICAL,HIGH,MEDIUM,LOW

      - name: Upload SARIF to GitHub Code Scanning
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: trivy-${{ matrix.image }}.sarif
          category: trivy-${{ matrix.image }}

      # Reuses the DB the SARIF step just downloaded. `cache: false` is
      # load-bearing: with the default cache the action restores the
      # previous run's DB cache OVER that fresh DB, and TRIVY_SKIP_DB_UPDATE
      # then scans with it (the gate's DB froze week after week until 3.0.3).
      - name: Scan for fixable vulnerabilities above the release gate
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ matrix.image }}-latest
          format: json
          output: trivy-${{ matrix.image }}.json
          scanners: vuln
          severity: CRITICAL,HIGH,MEDIUM,LOW
          ignore-unfixed: true
          cache: "false"
          skip-setup-trivy: true
        env:
          TRIVY_SKIP_DB_UPDATE: true

      - name: Extract findings
        env:
          FLAVOR: ${{ matrix.image }}
        run: |
          # One TSV line per finding: id, severity, package, installed, fixed, image
          jq -r --arg image "$FLAVOR" '
            .Results[]?.Vulnerabilities[]?
            | [.VulnerabilityID, .Severity, .PkgName, .InstalledVersion, .FixedVersion, $image]
            | @tsv' "trivy-${FLAVOR}.json" > "findings-${FLAVOR}.tsv"

          COUNT=$(wc -l < "findings-${FLAVOR}.tsv" | tr -d ' ')
          echo "### ${FLAVOR}: ${COUNT} fixable finding(s) above the release gate" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload findings
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: findings-${{ matrix.image }}
          path: findings-${{ matrix.image }}.tsv
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Fixable findings -> security release PR (auto-merge once CI is green)
  # ---------------------------------------------------------------------------
  security-release:
    needs: scan
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - name: Download findings
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: findings-*
          merge-multiple: true
          path: findings

      - name: Summarize findings
        id: findings
        run: |
          # Group identical findings across images:
          # - CVE-x (HIGH) in `pkg` 1.0, fixed in 1.1 (`alpine`, `alpine-dev`)
          cat findings/*.tsv | sort -u | awk -F'\t' '
            {
              key = $1 FS $2 FS $3 FS $4 FS $5
              if (!(key in images)) order[++n] = key
              images[key] = (key in images) ? images[key] ", `" $6 "`" : "`" $6 "`"
            }
            END {
              for (i = 1; i <= n; i++) {
                split(order[i], f, FS)
                printf "- %s (%s) in `%s` %s, fixed in %s (%s)\n", f[1], f[2], f[3], f[4], f[5], images[order[i]]
              }
            }' > entries.md

          COUNT=$(wc -l < entries.md | tr -d ' ')
          echo "count=${COUNT}" >> "$GITHUB_OUTPUT"
          if [ "$COUNT" -gt 0 ]; then
            { echo "## Fixable vulnerabilities above the release gate"; echo; cat entries.md; } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No fixable vulnerabilities above the release gate in the published images." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Check for a release build in progress
        if: steps.findings.outputs.count != '0'
        id: busy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A merge to master is being built and published right now (e.g. a
          # Renovate or security release). The images scanned above are
          # about to be replaced - re-evaluate on the next scan instead of
          # cutting a redundant release.
          RUNNING=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml \
            --branch "${{ github.event.repository.default_branch }}" --limit 5 \
            --json status --jq 'map(select(.status != "completed")) | length')
          echo "running=${RUNNING}" >> "$GITHUB_OUTPUT"
          if [ "$RUNNING" -gt 0 ]; then
            echo "Release build in progress on the default branch - skipping." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Create GitHub App token
        if: steps.findings.outputs.count != '0' && steps.busy.outputs.running == '0'
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.BOT_APP_CLIENT_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}

      - name: Checkout
        if: steps.findings.outputs.count != '0' && steps.busy.outputs.running == '0'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: repo
          token: ${{ steps.app-token.outputs.token }}

      - name: Open or refresh the security release PR
        if: steps.findings.outputs.count != '0' && steps.busy.outputs.running == '0'
        working-directory: repo
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |
          set -euo pipefail

          BOT_USER="${APP_SLUG}[bot]"
          BOT_ID=$(gh api "/users/${BOT_USER}" --jq .id)
          git config user.name "$BOT_USER"
          git config user.email "${BOT_ID}+${BOT_USER}@users.noreply.github.com"

          # The PR branch is always rebuilt from the current default branch:
          # a release merged in the meantime can never leave it with an
          # already-released VERSION or a conflicting CHANGELOG, and new
          # findings are picked up.
          BASE=$(git rev-parse --abbrev-ref HEAD)
          git checkout -b "$PR_BRANCH"
          .github/scripts/bump-release.sh HEAD Security ../entries.md
          VERSION=$(cat VERSION)

          {
            echo "Security release ${VERSION}: rebuild for fixable vulnerabilities"
            echo
            echo "Rebuilding picks up the fixed distro packages (apk/apt upgrade)."
            echo "Findings in the published images:"
            echo
            cat ../entries.md
          } > ../commit-msg.txt
          git commit -a -F ../commit-msg.txt

          if git fetch --quiet origin "$PR_BRANCH" 2>/dev/null \
            && git diff --quiet FETCH_HEAD HEAD; then
            echo "Security release PR branch is up to date." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git push --force origin "$PR_BRANCH"

          gh label create "$PR_LABEL" --color B60205 \
            --description "Automated security release (security-scan.yml)" --force

          {
            echo "Automated security release, maintained by \`security-scan.yml\` (refreshed against \`${BASE}\` on every scan while open)."
            echo
            echo "The published images contain fixable vulnerabilities (release gate: LOW and up, for runtime and \`-dev\` images). CI on this PR rebuilds all images (\`PACKAGE_REFRESH\` makes \`apk/apt upgrade\` pull the fixed packages) and the Trivy gate verifies the fix. The PR merges automatically once all required checks are green; the merge publishes release **${VERSION}**."
            echo
            echo "**If the Trivy gate stays red**, the fix is not available by rebuilding (e.g. Go stdlib - needs a Go update, PROJ/libspatialite - needs a version bump) and this PR needs a human."
            echo
            echo "### Findings"
            echo
            cat ../entries.md
          } > ../pr-body.md

          PR_URL=$(gh pr list --head "$PR_BRANCH" --state open --json url --jq '.[0].url // ""')
          if [ -n "$PR_URL" ]; then
            gh pr edit "$PR_URL" --title "Security release ${VERSION}" --body-file ../pr-body.md
            ACTION="Refreshed"
          else
            PR_URL=$(gh pr create --base "$BASE" --head "$PR_BRANCH" \
              --title "Security release ${VERSION}" \
              --body-file ../pr-body.md \
              --label "$PR_LABEL")
            ACTION="Opened"
          fi
          gh pr merge "$PR_URL" --auto --merge

          echo "${ACTION} ${PR_URL} (auto-merge enabled)" >> "$GITHUB_STEP_SUMMARY"
