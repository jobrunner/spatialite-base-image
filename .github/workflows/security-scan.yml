name: Security Scan

on:
  schedule:
    # Every Monday at 06:00 UTC
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        image: [alpine, alpine-dev, ubuntu, ubuntu-dev]

    steps:
      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Trivy scan (SARIF report, all severities)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ matrix.image }}-latest
          format: sarif
          output: trivy-${{ matrix.image }}.sarif
          scanners: vuln
          severity: CRITICAL,HIGH,MEDIUM,LOW

      - name: Upload SARIF to GitHub Code Scanning
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          sarif_file: trivy-${{ matrix.image }}.sarif
          category: trivy-${{ matrix.image }}

      # Reuses the DB the SARIF step just downloaded. `cache: false` is
      # load-bearing: with the default cache the action restores the
      # previous run's DB cache OVER that fresh DB, and TRIVY_SKIP_DB_UPDATE
      # then scans with it. The first matrix job of a day saves that stale
      # DB as the new day's cache, so the gate's DB froze week after week:
      # on 2026-10-26 this step reported 0 findings for the go1.26.8
      # toolchain while the SARIF step above flagged its stdlib CVEs.
      - name: Fail on fixable HIGH/CRITICAL vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ matrix.image }}-latest
          format: table
          scanners: vuln
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
          cache: "false"
          skip-setup-trivy: true
        env:
          TRIVY_SKIP_DB_UPDATE: true
