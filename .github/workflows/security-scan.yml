name: Security Scan

# Scans the published images every 6 hours (the Trivy vulnerability DB is
# refreshed at the same cadence) and reports all findings to GitHub Code
# Scanning.
#
# Fixable HIGH/CRITICAL findings are not just reported: the workflow opens a
# security release PR (VERSION bump + CHANGELOG entry listing the CVEs) as the
# repository's GitHub App and enables auto-merge. CI rebuilds the images on
# that PR - picking up the fixed distro packages via apk/apt upgrade - and the
# Trivy gate proves the fix before the PR merges and the release is published.
# If the gate stays red, the fix is not available by rebuilding (e.g. Go
# stdlib, which needs a Go update) and the PR waits for a human.

on:
  schedule:
    - cron: "41 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-scan
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  PR_LABEL: security-release

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        image: [alpine, alpine-dev, ubuntu, ubuntu-dev]

    steps:
      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Trivy scan (SARIF report, all severities)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ matrix.image }}-latest
          format: sarif
          output: trivy-${{ matrix.image }}.sarif
          scanners: vuln
          severity: CRITICAL,HIGH,MEDIUM,LOW

      - name: Upload SARIF to GitHub Code Scanning
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          sarif_file: trivy-${{ matrix.image }}.sarif
          category: trivy-${{ matrix.image }}

      - name: Scan for fixable HIGH/CRITICAL vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ matrix.image }}-latest
          format: json
          output: trivy-${{ matrix.image }}.json
          scanners: vuln
          severity: CRITICAL,HIGH
          ignore-unfixed: true
        env:
          TRIVY_SKIP_DB_UPDATE: true

      - name: Extract findings
        env:
          FLAVOR: ${{ matrix.image }}
        run: |
          # One TSV line per finding: id, severity, package, installed, fixed, image
          jq -r --arg image "$FLAVOR" '
            .Results[]?.Vulnerabilities[]?
            | [.VulnerabilityID, .Severity, .PkgName, .InstalledVersion, .FixedVersion, $image]
            | @tsv' "trivy-${FLAVOR}.json" > "findings-${FLAVOR}.tsv"

          COUNT=$(wc -l < "findings-${FLAVOR}.tsv" | tr -d ' ')
          echo "### ${FLAVOR}: ${COUNT} fixable HIGH/CRITICAL finding(s)" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload findings
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: findings-${{ matrix.image }}
          path: findings-${{ matrix.image }}.tsv
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Fixable findings -> security release PR (auto-merge once CI is green)
  # ---------------------------------------------------------------------------
  security-release:
    needs: scan
    runs-on: ubuntu-latest
    steps:
      - name: Download findings
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: findings-*
          merge-multiple: true
          path: findings

      - name: Summarize findings
        id: findings
        run: |
          # Group identical findings across images:
          # - CVE-x (HIGH) in `pkg` 1.0, fixed in 1.1 (`alpine`, `alpine-dev`)
          cat findings/*.tsv | sort -u | awk -F'\t' '
            {
              key = $1 FS $2 FS $3 FS $4 FS $5
              if (!(key in images)) order[++n] = key
              images[key] = (key in images) ? images[key] ", `" $6 "`" : "`" $6 "`"
            }
            END {
              for (i = 1; i <= n; i++) {
                split(order[i], f, FS)
                printf "- %s (%s) in `%s` %s, fixed in %s (%s)\n", f[1], f[2], f[3], f[4], f[5], images[order[i]]
              }
            }' > entries.md

          COUNT=$(wc -l < entries.md | tr -d ' ')
          echo "count=${COUNT}" >> "$GITHUB_OUTPUT"
          if [ "$COUNT" -gt 0 ]; then
            { echo "## Fixable HIGH/CRITICAL vulnerabilities"; echo; cat entries.md; } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No fixable HIGH/CRITICAL vulnerabilities in the published images." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Create GitHub App token
        if: steps.findings.outputs.count != '0'
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.BOT_APP_CLIENT_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}

      - name: Check for an open security release PR
        if: steps.findings.outputs.count != '0'
        id: open-pr
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          # One security release at a time: an open PR rebuilds with ALL
          # currently available fixes anyway, so new findings ride along.
          PR=$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --label "$PR_LABEL" \
            --json url --jq '.[0].url // ""')
          echo "url=${PR}" >> "$GITHUB_OUTPUT"
          if [ -n "$PR" ]; then
            echo "Security release PR already open: ${PR}" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Checkout
        if: steps.findings.outputs.count != '0' && steps.open-pr.outputs.url == ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: repo
          token: ${{ steps.app-token.outputs.token }}

      - name: Open security release PR
        if: steps.findings.outputs.count != '0' && steps.open-pr.outputs.url == ''
        working-directory: repo
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |
          set -euo pipefail

          BOT_USER="${APP_SLUG}[bot]"
          BOT_ID=$(gh api "/users/${BOT_USER}" --jq .id)
          git config user.name "$BOT_USER"
          git config user.email "${BOT_ID}+${BOT_USER}@users.noreply.github.com"

          BASE=$(git rev-parse --abbrev-ref HEAD)
          BRANCH="security/release-$(date -u +%Y%m%d-%H%M)"
          git checkout -b "$BRANCH"

          .github/scripts/bump-release.sh HEAD Security ../entries.md
          VERSION=$(cat VERSION)

          {
            echo "Security release ${VERSION}: rebuild for fixable vulnerabilities"
            echo
            echo "Rebuilding picks up the fixed distro packages (apk/apt upgrade)."
            echo "Findings in the published images:"
            echo
            cat ../entries.md
          } > ../commit-msg.txt
          git commit -a -F ../commit-msg.txt
          git push origin "$BRANCH"

          gh label create "$PR_LABEL" --color B60205 \
            --description "Automated security release (security-scan.yml)" --force

          {
            echo "Automated security release, opened by \`security-scan.yml\`."
            echo
            echo "The published images contain fixable HIGH/CRITICAL vulnerabilities. CI on this PR rebuilds all images (\`apk/apt upgrade\` pulls in the fixed packages) and the Trivy gate verifies the fix. The PR merges automatically once all required checks are green; the merge publishes release **${VERSION}**."
            echo
            echo "**If the Trivy gate stays red**, the fix is not available by rebuilding (e.g. Go stdlib - needs a Go update, PROJ/libspatialite - needs a version bump) and this PR needs a human."
            echo
            echo "### Findings"
            echo
            cat ../entries.md
          } > ../pr-body.md

          PR_URL=$(gh pr create --base "$BASE" --head "$BRANCH" \
            --title "Security release ${VERSION}" \
            --body-file ../pr-body.md \
            --label "$PR_LABEL")
          gh pr merge "$PR_URL" --auto --merge

          echo "Opened ${PR_URL} (auto-merge enabled)" >> "$GITHUB_STEP_SUMMARY"
