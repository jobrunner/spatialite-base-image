name: Renovate

# Self-hosted Renovate (replaces Dependabot version updates), authenticated as
# the repository's GitHub App so that its PRs trigger CI and can auto-merge.
#
# Every Renovate PR is a complete patch release: the post-upgrade task
# (.github/scripts/renovate-post-upgrade.sh) recomputes download checksums
# and bumps VERSION, CHANGELOG.md and the README examples. Rebuilt base
# images (digest updates) and Go patch releases auto-merge once CI is green;
# everything else waits for review. See .github/renovate.json.

on:
  schedule:
    # Hourly: a patched base image is picked up within the hour
    - cron: "23 * * * *"
  workflow_dispatch:
  # Every merge is a release, so open Renovate PRs are behind (and claim a
  # taken VERSION) right after it: rebase them immediately
  push:
    branches: [main, master]
  # Checkboxes ticked by a human in the Dependency Dashboard or in a Renovate
  # PR take effect right away instead of on the next hourly run.
  # pull_request_target, not pull_request: GitHub does not run pull_request
  # workflows for PRs with merge conflicts - exactly the PRs that need the
  # rebase. Safe here: it runs master's workflow and never checks out PR code.
  issues:
    types: [edited]
  pull_request_target:
    types: [edited]

permissions:
  contents: read

jobs:
  renovate:
    # Only human edits that tick a checkbox. Renovate's own edits (as the
    # GitHub App, sender type Bot) must not trigger another run.
    if: >-
      (github.event_name != 'issues' && github.event_name != 'pull_request_target') ||
      (github.event.sender.type != 'Bot' && (
        (github.event_name == 'issues' &&
         github.event.issue.title == 'Dependency Dashboard' &&
         contains(github.event.issue.body, '- [x] <!--')) ||
        (github.event_name == 'pull_request_target' &&
         startsWith(github.event.pull_request.head.ref, 'renovate/') &&
         github.event.pull_request.head.repo.full_name == github.repository &&
         contains(github.event.pull_request.body, '- [x] <!-- rebase-check -->'))))
    # On the job, not the workflow: skipped runs (bot edits) never enter the
    # group, so they cannot replace a pending run that was really requested
    concurrency:
      group: renovate
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.BOT_APP_CLIENT_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}

      - name: Run Renovate
        uses: renovatebot/github-action@266fef21329c44765ad42f9dea1f01f5d2d91084 # v46.3.13
        with:
          token: ${{ steps.app-token.outputs.token }}
          # Updated by Renovate itself (weekly, together with the actions)
          renovate-version: 44.226.2
        env:
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_ONBOARDING: "false"
          RENOVATE_REQUIRE_CONFIG: required
          # Global-only: the post-upgrade task is the single command allowed
          RENOVATE_ALLOWED_COMMANDS: '["^bash \\.github/scripts/renovate-post-upgrade\\.sh [A-Za-z0-9._/-]+$"]'
          LOG_LEVEL: info
